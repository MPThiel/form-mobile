# Fly.io configuration for the FORM backend.
# Edit `app` to the real app name after `fly launch` (use `--no-deploy` so the
# generated file doesn't overwrite this one with auto-detected defaults you
# don't want).

app = "form-server"
primary_region = "lhr"  # London — closest free-tier region to NA timezone

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
